name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v3
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        issue_message: "Hello! 👋 Thank you for opening your first issue. We appreciate your contribution! 🎉"
        pr_message: "Hi there! 👋 Congratulations on your first pull request! Your efforts make a difference! 🚀"
